
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSD Quiz Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>FSD QUIZ PORTAL</h1>
    </header>

    <!-- Student Form -->
    <div class="container" id="student-form">

        <h2>Student Details</h2>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >

        <input
            type="number"
            id="rollno"
            placeholder="Enter roll number"
        >

        <input
            type="text"
            id="section"
            placeholder="Enter section"
        >

        <button id="start-btn">Start Quiz</button>

        <p id="error"></p>

    </div>


    <!-- Quiz -->
    <div class="container quiz-container" id="quiz-container">

        <div class="quiz-top">

            <span id="question-number">
                Question 1 of 5
            </span>

            <span id="score">
                Score: 0
            </span>

        </div>

        <h2 id="question">
            Question will appear here
        </h2>

        <div id="options"></div>

        <div class="navigation">

            <button id="prev-btn">
                Previous
            </button>

            <button id="next-btn">
                Next
            </button>

        </div>

    </div>


    <!-- Result -->
    <div class="container result-container" id="result-container">

        <h2>Quiz Completed!</h2>

        <h3 id="student-name"></h3>

        <p id="final-score"></p>

        <button id="restart-btn">
            Restart Quiz
        </button>

    </div>


    <footer>
        <p>© 2026 FSD Quiz Portal</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
